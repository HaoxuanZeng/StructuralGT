name: StructuralGT GUI

on:
  push:
    branches:
      - gui-api-integration
    paths:
      - "StructuralGT/app/**"
      - ".github/workflows/gui.yml"

jobs:
  test:
    name: GUI Test on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        python: ['312']
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Create GUI Testing Environment
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        with:
          micromamba-version: '2.0.2-2'
          environment-name: StructuralGT_GUI
          environment-file: StructuralGT/app/environment.yml

      - name: Install cuda-toolkit
        if: matrix.os == 'ubuntu-latest'
        shell: bash -l {0}
        run: micromamba install -n StructuralGT_GUI -c conda-forge -y cuda-toolkit

      - name: Install Xvfb # For headless testing on Linux
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run GUI From Source
        working-directory: StructuralGT/app
        shell: bash -l {0}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python src/main.py &
          else
            python src/main.py &
          fi
          APP_PID=$!
          sleep 20
          kill $APP_PID 2>/dev/null || true

      - name: Run PyInstaller Build
        working-directory: StructuralGT/app
        shell: bash -l {0}
        run: |
          pyinstaller StructuralGT.spec
